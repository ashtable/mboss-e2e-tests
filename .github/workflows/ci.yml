name: CI
on: [pull_request]

jobs:
  # The hermetic half. No submodules, no docker, no
  # browsers — deliberately, because a checkout with
  # none of them is the only place the claim that
  # lint and the unit tests need nothing else is
  # actually tested. If a helper or a fixture ever
  # starts reaching for a container, this job is
  # where it goes red.
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # The compose stack and the cloud specs.
  # `submodules: recursive` is mandatory: web, api and
  # dbos each COPY a second layer of nested submodules
  # into their build context, so a non-recursive init
  # leaves those empty and every image build fails on
  # the COPY.
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # --wait exits non-zero unless every service that
      # declares a healthcheck reaches healthy, so a
      # broken stack fails here, with the build output
      # still readable, rather than as nine specs
      # failing on connection refused.
      - run: npm run stack:up
      - run: npm run e2e:cloud

      - name: Collect stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color > stack.log

      - name: Upload traces, videos and stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-failure
          path: |
            playwright-report/
            test-results/
            stack.log

      # Always, so a failed run leaves no containers or
      # volumes behind for the next one to inherit.
      - name: Tear the stack down
        if: always()
        run: npm run stack:down

  # The MCP bundle and the specs that drive it.
  # `submodules: recursive` is mandatory here too, for
  # a different reason: mboss-mcp-server nests core
  # and skills, and the bundle inlines core's source,
  # so a non-recursive init leaves the build with
  # nothing to bundle.
  #
  # No browsers are installed: the specs in this
  # project take no `page`. They speak to a child
  # process over stdio.
  # Above what the specs themselves allow, on
  # purpose. The project runs one worker, so its
  # budgets add up: 900s for the durability
  # beforeAll, 900s for the run itself, 600s for the
  # image build, 180s for the teardown, and 180s
  # each for the two fast specs — 49 minutes, before
  # `npm ci` and the bundle build. A cap below that
  # would make GitHub the thing that stops a hung
  # run, and GitHub cancelling a job produces no
  # trace and no report. In practice this job
  # finishes in a few minutes.
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      # Its own step rather than something global
      # setup does, for the same reason `stack:up` is:
      # a build failure should read as a build
      # failure, not as seven specs failing on a
      # missing file.
      - run: npm run mcp:build
      - run: npm run e2e:mcp

      # Always, not on failure: a job cancelled for
      # running past `timeout-minutes` is not a
      # failure as far as GitHub is concerned, so an
      # `if: failure()` step does not run — and a
      # hang is exactly the case with something worth
      # reading.
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-failure
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

      # The durability spec's own teardown never runs
      # if the worker is killed, and the project name
      # is fixed, so what it leaves behind is what the
      # next run on this machine inherits. Ephemeral
      # runners hide that; a self-hosted one does not.
      - name: Tear the crash fixture down
        if: always()
        run: docker compose -p crash-fixture down -v || true

  # The packaged VS Code extension, driven inside a
  # real editor.
  #
  # `submodules: recursive` for a third reason:
  # mboss-vscode nests core, the MCP server and the
  # skill, and its package inlines all three, so a
  # non-recursive init leaves `vsce package` with
  # nothing to zip.
  #
  # No browsers are installed. The window under test
  # is Electron's, launched by the suite from the
  # editor build it downloads — which is also why
  # this is the one job that needs a display, and
  # `xvfb-run` is what gives it one.
  #
  # The budget, per step, the way the mcp job spells
  # its own out: 600s for the package build, 300s per
  # spec file and four of them, and 300s for `npm
  # ci`. Half an hour, and in practice it finishes in
  # about five minutes. A cap below that would make
  # GitHub the thing that stops a hung run, and a
  # cancelled job leaves no trace and no report.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      # Three hundred megabytes, and the same three
      # hundred on every run until the pin moves —
      # which is exactly what the key is the pin
      # file's hash for.
      - name: Cache the pinned editor
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('.vscode-version') }}

      # Its own step rather than something global
      # setup does, for the same reason `mcp:build`
      # is: a build failure should read as a build
      # failure, not as fifteen specs failing on a
      # missing package.
      - run: npm run vscode:build
      - run: xvfb-run -a npm run e2e:ext

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extension-failure
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
